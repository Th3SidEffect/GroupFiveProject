<!DOCTYPE html>
<html lang="en"><head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Professional Image Gallery</title>

    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin="">
    <link href="https://fonts.googleapis.com/css2?family=Lora:ital,wght@0,400;0,500&amp;family=Playfair+Display:ital,wght@0,600;0,700&amp;display=swap" rel="stylesheet">

    <link rel="stylesheet" href="styles.css">
</head>
<body>

    
<header class="header">

    <div class="header-text">
        <img src="project logo.png" alt="IMGBar Logo" class="logo" height = "100px" >

        <div>
            <h1>IMGBar</h1>
            <p>Where Every Picture Tells a Story</p>
        </div>
    </div>

    <button id="theme-toggle" class="theme-btn">
        Toggle Dark Mode
    </button>

</header>
    <div class="gallery-container">
        <div class="gallery-card">
            <div class="img-wrapper">
                <img src="https://images.unsplash.com/photo-1486406146926-c627a92ad1ab?q=80&amp;w=800&amp;auto=format&amp;fit=crop" alt="Architecture" class="gallery-img">
            </div>
            <div class="card-content">
                <h2>Architecture</h2>
                <p>Urban Structures</p>
            </div>
        </div>

        <div class="gallery-card">
            <div class="img-wrapper">
                <img src="https://images.unsplash.com/photo-1472214103451-9374bd1c798e?q=80&amp;w=800&amp;auto=format&amp;fit=crop" alt="Landscapes" class="gallery-img">
            </div>
            <div class="card-content">
                <h2>Landscapes</h2>
                <p>Natural World</p>
            </div>
        </div>

        <div class="gallery-card">
            <div class="img-wrapper">
                <img src="https://images.unsplash.com/photo-1550684848-fac1c5b4e853?q=80&amp;w=800&amp;auto=format&amp;fit=crop" alt="Abstract" class="gallery-img">
            </div>
            <div class="card-content">
                <h2>Abstract</h2>
                <p>Creative Concepts</p>
            </div>
        </div>

        <div class="gallery-card">
            <div class="img-wrapper">
                <img src="https://images.unsplash.com/photo-1441974231531-c6227db76b6e?q=80&amp;w=800&amp;auto=format&amp;fit=crop" alt="Nature" class="gallery-img">
            </div>
            <div class="card-content">
                <h2>Nature</h2>
                <p>Flora &amp; Fauna</p>
            </div>
        </div>

        <div class="gallery-card">
            <div class="img-wrapper">
                <img src="https://images.unsplash.com/photo-1449844908441-8829872d2607?q=80&amp;w=800&amp;auto=format&amp;fit=crop" alt="Urban" class="gallery-img">
            </div>
            <div class="card-content">
                <h2>Urban</h2>
                <p>Street Photography</p>
            </div>
        </div>

        <div class="gallery-card">
            <div class="img-wrapper">
                <img src="https://images.unsplash.com/photo-1518770660439-4636190af475?q=80&amp;w=800&amp;auto=format&amp;fit=crop" alt="Technology" class="gallery-img">
            </div>
            <div class="card-content">
                <h2>Technology</h2>
                <p>Digital Life</p>
            </div>
        </div>
    </div>

    <div id="lightbox" class="lightbox-hidden">
        <div class="lightbox-controls">
            <button id="zoom-out" class="control-btn">- Zoom</button>
            <span id="zoom-text" class="zoom-text">100%</span>
            <button id="zoom-in" class="control-btn">+ Zoom</button>
            <button id="close-btn" class="control-btn close-btn">Close X</button>
        </div>

        <div class="lightbox-content">
            <button id="prev-btn" class="nav-btn">&lt;</button>
            <div class="lightbox-img-container">
                <img id="lightbox-img" src="" alt="Enlarged view">
            </div>
            <button id="next-btn" class="nav-btn">&gt;</button>
        </div>
    </div>

    <script src="script.js"></script>


</body>
</html>
